name: hacmdn
label: HACMDN-Net
version: 1.0.0
manifest_version: 2
api_version: 1
author: Jonathan Korstad
license: Apache-2.0
homepage: https://github.com/Jpalmer95/hacmdn-net
requires_hermes: ">=0.21.6"
description: >
  Hermes Agent Community Microtuned Decentralized Node Network (HACMDN-Net) —
  neighborhood-based routing across consumer-grade micro-to-32B and sparse-MoE
  specialists (10M classifiers/translators up to 32B/MoE domain reasoners)
  with topological Connector referrals, semantic-entropy abstention, missing-
  expertise gap sensing, validator health checks & generational base-model
  renewal, Game-Guard hardware profiling, and value-backed 70/10/10/10
  attribution with a Fair-Share Cap and Patron Compute Overflow for DeSci.
tags:
  - decentralized
  - routing
  - micro-models
  - qwen3
  - zerogpu
  - huggingface
  - specialist-network
  - depin
provides_tools:
  - hacmdn_route_query
  - hacmdn_publish_specialist
  - hacmdn_bid_task
  - hacmdn_bounty_flywheel
  - hacmdn_network_status
  - hacmdn_worker_pool
  - hacmdn_contributor_hub
provides_hooks: []
config_schema:
  neighborhood_id:
    type: str
    default: "nbh-austin-core"
    label: "Neighborhood ID"
    description: "Default local neighborhood cluster ID"
  operator_id:
    type: str
    default: "jkorstad-node-01"
    label: "Node Operator ID"
    description: "Contributor handle for attribution, royalties, and community payouts"
  compute_mode:
    type: str
    choices: ["auto_game_guard", "spare_cpu_only", "gpu_when_idle", "paused"]
    default: "auto_game_guard"
    label: "Compute Contribution Mode"
    description: "How this node offers spare compute to the neighborhood mesh"
  daily_community_cap:
    type: float
    default: 50.0
    label: "Anti-Whale Daily Personal Cap (Credits)"
    description: "Per-operator daily credit cap before overflow donates to the Shared Community Pool"
  zerogpu_space_id:
    type: str
    default: "jkorstad/hacmdn-community-buffer"
    label: "ZeroGPU Buffer Space"
    description: "Hugging Face Space ID used as Tier 3 cold-start & gap load-balancing buffer"
  hf_collection_slug:
    type: str
    default: "jkorstad/hacmdn-net-hermes-community-microtuned-specialist-network-6aef78f6e0ea208136c602e5"
    label: "HF Community Collection"
    description: "Canonical Hugging Face Collection storing verified community specialist adapters"
  enable_zerogpu_fallback:
    type: bool
    default: true
    label: "Enable ZeroGPU Buffer Fallback"
    description: "Route to the Hugging Face ZeroGPU Community Buffer when local P2P workers are offline"
  sampling_audit_rate:
    type: float
    default: 0.05
    label: "Sampling Audit Rate"
    description: "Fraction of routed tasks cross-audited for correctness verification (0.05 = 5%)"
  hf_token:
    type: secret
    env: HF_TOKEN
    label: "Hugging Face Token"
    description: "Optional HF token for ZeroGPU Space quota and Hub collection sync"
